name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generated files are in sync
        run: |
          node tools/catalog/build.mjs --check
          node tools/schema/build-schemas.mjs --check
      - name: Run the regression suite
        run: node tests/run-tests.mjs

  example-pdf:
    # Rebuilds the worked example end to end from the public lab and keeps the PDF as an artifact.
    runs-on: ubuntu-latest
    needs: regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the Contoso Store assessment
        run: examples/contoso-store/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: contoso-store-assessment
          path: examples/contoso-store/output/contoso-store-assessment.pdf
